<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Barbearia</title>
  <link rel="stylesheet" href="css/estilo.css">
  <script type="module" src="js/login.js"></script>
</head>
<body>
  <div class="tela-login">
    <form id="form-login" class="cartao" novalidate>
      <div class="marca"><span class="logo">✂</span><strong>Barbearia</strong></div>
      <h2>Entrar</h2>
      <label>E-mail
        <input type="email" name="email" autocomplete="username" required>
      </label>
      <label>Senha
        <input type="password" name="senha" autocomplete="current-password" required>
      </label>
      <p class="erro-login" id="erro-login" role="alert"></p>
      <button class="btn primario" type="submit">Entrar</button>
      <p class="nota">Esqueceu a senha? Fale com o administrador do sistema.</p>
    </form>
  </div>
</body>
</html>
